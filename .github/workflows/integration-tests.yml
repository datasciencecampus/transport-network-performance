# This workflow will install Python dependencies and run only integration tests
# This is a standalone runner such that if integration testing fails it does not
# impact other runners.
# Fixing OS version to avoid breaking OS changes during development stage.
# Will open up OS versions before release.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: MacOS Integration Tests

on:
  push:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    name: Integration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]
        os: ["macos-12"]
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # SHA for v4.1.7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@9a7ac94420f42ee15fc60ab88d0dca4be1fd5757 # SHA for v5.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[test]'
    - name: Install java
      uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # SHA for v4.2.1
      with:
        distribution: 'temurin'
        java-version: '11.0.21'
    - name: Check Java Install
      run: |
        java --version
    - name: Install mac dependencies with brew  # not updating brew version, issue with aom
      run: |
        brew --version
        curl https://raw.githubusercontent.com/Homebrew/homebrew-core/fc3b38db25493e08020dd2479a94061636edcad4/Formula/osmosis.rb > osmosis.rb
        brew install --build-from-source ./osmosis.rb
        brew info osmosis
      shell: sh
    - name: Run Integration Tests Only
      run: |
        pytest -m runinteg --runinteg --ignore tests/analyse_network --ignore tests/test_analyse_network.py
